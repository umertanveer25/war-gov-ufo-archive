name: Download All Media Tranches in Cloud

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: "1"
            start: 0
            size: 40
            zip: "ufo_media_part1.zip"
          - part: "2"
            start: 40
            size: 40
            zip: "ufo_media_part2.zip"
          - part: "3"
            start: 80
            size: 40
            zip: "ufo_media_part3.zip"
          - part: "4"
            start: 120
            size: 45
            zip: "ufo_media_part4.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Media Batch ${{ matrix.part }}
        run: |
          python scripts/cloud_downloader.py --start ${{ matrix.start }} --size ${{ matrix.size }} --output-zip ${{ matrix.zip }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-complete-archive"
          name: "Complete Declassified PURSUE UAP/UFO Multi-Tranche Archive"
          body: |
            ### Complete Multi-Tranche Declassified UAP/UFO Archive
            Automated cloud-processed release from military and intelligence feeds (DVIDS, CloudFront, war.gov).
            Includes all sensor footage, FLIR telemetry, and flight debriefs.
          files: ${{ matrix.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
