name: Download All Media Tranches in Cloud

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: "01"
            start: 0
            size: 20
            zip: "ufo_media_part01.zip"
          - part: "02"
            start: 20
            size: 20
            zip: "ufo_media_part02.zip"
          - part: "03"
            start: 40
            size: 20
            zip: "ufo_media_part03.zip"
          - part: "04"
            start: 60
            size: 20
            zip: "ufo_media_part04.zip"
          - part: "05"
            start: 80
            size: 20
            zip: "ufo_media_part05.zip"
          - part: "06"
            start: 100
            size: 20
            zip: "ufo_media_part06.zip"
          - part: "07"
            start: 120
            size: 20
            zip: "ufo_media_part07.zip"
          - part: "08"
            start: 140
            size: 25
            zip: "ufo_media_part08.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Media Batch ${{ matrix.part }}
        run: |
          python scripts/cloud_downloader.py --start ${{ matrix.start }} --size ${{ matrix.size }} --output-zip ${{ matrix.zip }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-complete-archive"
          name: "Complete Declassified PURSUE UAP/UFO Multi-Tranche Archive"
          body: |
            ### Complete Multi-Tranche Declassified UAP/UFO Archive
            Automated cloud-processed release from military and intelligence feeds (DVIDS, CloudFront, war.gov).
            Includes all sensor footage, FLIR telemetry, and flight debriefs.
          files: ${{ matrix.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
